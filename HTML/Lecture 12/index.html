<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise L-12</title>
</head>
<body>
    <!-- You are given 12 files: 6 audios and 6 videos -->
    <!-- Design a website using HTML only which show these 12 files. -->
    <!-- 1.mp3, 2.mp3 .... 6.mp3 -->
    <!-- 1.mp4, 2.mp4 .... 6.mp4 -->
    <main>
        <video src="assets/1.mp4" controls muted width="250" height="400" preload="auto">1.mp4</video>
        <video src="assets/2.mp4" controls muted width="250" height="400" preload="auto">2.mp4</video>
        <video src="assets/3.mp4" controls muted width="250" height="400" preload="auto">3.mp4</video>
        <video src="assets/4.mp4" controls muted width="250" height="400" preload="auto">4.mp4</video>
        <video src="assets/5.mp4" controls muted width="250" height="400" preload="auto">5.mp4</video>
        <audio src="assets/1.mp3" controls muted preload="auto">1.mp3</audio>
        <audio src="assets/2.mp3" controls muted preload="auto">2.mp3</audio>
        <audio src="assets/3.mp3" controls muted preload="auto">3.mp3</audio>
        <audio src="assets/4.mp3" controls muted preload="auto">4.mp3</audio>
        <audio src="assets/5.mp3" controls muted preload="auto">5.mp3</audio>
        <audio src="assets/6.mp3" controls muted preload="auto">6.mp3</audio>
    </main>
</body>
</html>
