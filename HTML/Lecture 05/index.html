<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img height="500" src="assets/Midnight.png" alt="Midnight">
    <table>
        <caption>Target Details</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Designation</th>
            <th>Hobby</th>
            <th>Favorite thing to do in free time</th>
        </tr>
        <tr>
            <td>Hariom</td>
            <td>18</td>
            <td>Student</td>
            <td>Coding</td>
            <td rowspan="3">Watching Movies</td>
        </tr>
        <tr>
            <td>Sonil</td>
            <td colspan="2">17</td>
            <td>Playing video games</td>
  
        </tr>
        <tr>
            <td>Ritvik</td>
            <td>19</td>
            <td>Student</td>
            <td>Playing cricket</td>
        </tr>
    </table>
    <ul type="circle">
        <li>Hariom</li>
        <li>Sonil</li>
        <li>Ritvik</li>
    </ul>
    <ol type="i">
        <li>Hariom</li>
        <li>Sonil</li>
        <li>Ritvik</li>
    </ol>
</body>
</html>
