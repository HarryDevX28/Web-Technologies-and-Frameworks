<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HTML Forms" />
    <title>Forms - Lets Learn it</title>
</head>

<body>
    <h1>Form for GG GODS Team - BGMI</h1>
    <form action="post">
        <div>
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your name..." required autofocus>
        </div>
        <div>
            <input type="radio" id="male" name="gender" required />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" />
            <label for="female">Female</label>
            <input type="radio" id="others" name="gender" />
            <label for="others">Others</label>
        </div>
        <div>
            <select id="role" name="type" required>
                <option value="" selected disabled hidden>Select your role</option>
                <option value="igl">In-Game Leader</option>
                <option value="assaulter">Assaulter</option>
                <option value="sniper">Sniper</option>
                <option value="scout">Scout</option>
            </select>
        </div>
        <div>
            <label for="comment">Describe your self:</label> <br />
            <textarea id="comment" name="comment" rows="4" cols="50" required></textarea>
        </div>
        <div>
            <input type="checkbox" />
            <label for="checkbox">Email the result</label>
        </div>
        <button type="submit">Send</button>
    </form>
</body>

</html>
