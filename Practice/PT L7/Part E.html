<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="input types">
    <title>10 Input types that i learned</title>
</head>

<body>
    <h1>These are the 10 input types that i have learned</h1>
   
    <div>
        <label for="button">Button :</label>
        <input type="button" id="button" name="button">
    </div>
    
    <div>
        <label for="checkbox">Checkbox :</label>
        <input type="checkbox" id="checkbox" name="checkbox">
    </div>
    
    <div>
        <label for="date">Date :</label>
        <input type="date" id="date" name="date">
    </div>
    
    <div>
        <label for="datetime">Datetime :</label>
        <input type="datetime" id="datetime" name="datetime">
    </div>
    
    <div>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email">
    </div>
    
    <div>
        <label for="file">File :</label>
        <input type="file" id="file" name="file">
    </div>
    
    <div>
        <label for="month">Month :</label>
        <input type="month" id="month" name="month">
    </div>
    
    <div>
        <label for="number">Number :</label>
        <input type="number" id="number" name="number">
    </div>
    
    <div>
        <label for="password">Password :</label>
        <input type="password" id="password" name="password">
    </div>
    
    <div>
        <label for="radio">Radio :</label>
        <input type="radio" id="radio" name="radio">
    </div>

</body>

</html>
