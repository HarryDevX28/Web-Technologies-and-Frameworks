<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outline in Css</title>
    <style>
        .box{
            border: 2px solid black;
            margin: 5px;
            padding: 5px;
            width: 141px;
            box-shadow: 5px 5px 15px 5px rgb(10, 201, 41);
        }
        .outdiv{
            margin: 10px;
            text-shadow: 5px 15px 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a Box inside div.
   </div>
   <p class="outdiv">I am a para outside box</p>
</body>
</html>
