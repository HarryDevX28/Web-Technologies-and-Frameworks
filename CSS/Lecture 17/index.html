<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Selector</title>
    <style>
        .red{
            background-color: red;
        }
        #green{
            background-color: green;
        }
        div > p {
            color: blue;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="red">
        i am a div
        <p>I am a child select</p>
    </div>
    <div id="green">
        i am also a div
    </div>
</body>
</html>
