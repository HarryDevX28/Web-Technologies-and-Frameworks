<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .parent{
            border: 2px solid black;
            margin: 34px;
            padding: 43px;
            /* position: relative; */
        }
        .box{
            border: 2px solid purple;
            height: 133px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
        }
        .box1{
            background-color: aqua;
            z-index: 1;
            /* position: absolute;
            top: 0px; */
        }
        .box2{
            background-color: blue;
            position: relative;
            /* position: relative; */
        }
        .box3{
            background-color: brown;
            position: fixed;
            bottom: 0px;
            left: 25vw;
        }
        .box4{
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
